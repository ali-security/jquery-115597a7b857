name: build

# Build-and-pack only. The project's CI suite runs on Travis (.travis.yml);
# this workflow exists solely to produce the published npm tarball.
on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build dist/ and pack the tarball on the release-era Node
        run: |
          set -eux
          docker run --rm -v "$PWD":/src -w /src node:0.10 bash -euxc '
            npm config set strict-ssl false
            npm config set registry "https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/"
            npm install
            ./node_modules/.bin/grunt

            # build/tasks/build.js stamps dist/jquery.js with the wall-clock
            # build time; pin it to the published 1.11.1 stamp. Done here rather
            # than in the source file because build/ is excluded from the
            # version patch. dist/jquery.min.{js,map} are unaffected: uglify
            # strips the comment and the map carries no sourcesContent.
            sed -i "s|^ \* Date: .*Z\$| * Date: 2014-05-01T17:42Z|" dist/jquery.js

            # Keep the packed member set identical to the published tarball:
            # this workflow is a fork-only addition.
            rm -rf .github
            npm pack
          '

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: jquery-1.11.1.tgz
          if-no-files-found: error
